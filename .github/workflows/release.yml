name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - run: bun install

      - run: bun run typecheck

      - run: bun test

      - name: Build and publish draft release
        run: bun run build && bunx --bun electron-builder --windows --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
