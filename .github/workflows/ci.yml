name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - run: bun install

      - run: bun run typecheck

      - run: bun test

      - run: bun run build

      # The packaged app itself is built only by the tag-triggered release
      # workflow on windows-latest; here we verify the compile step.
      - run: bunx tsc --noEmit

  verify-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install docs dependencies
        working-directory: docs
        run: bun install --frozen-lockfile

      # Build-verify only — deployment lives in docs.yml on release publish.
      - name: Build docs
        working-directory: docs
        run: bun run build
